name: Build

on:
  push:
    branches: [ "dev" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after building
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

jobs:
  Linux-App:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
      with:
        key: "v1-ubuntu-22.04-x86_64"
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          binutils build-essential curl desktop-file-utils libfontconfig1-dev \
          libfreetype6-dev libudev-dev libxkbcommon-x11-0 pkg-config xauth xdotool xvfb
    - name: Build and package Linux AppImage
      run: bash ./.github/scripts/build-linux-appimage.sh
    - name: Verify Linux AppImage and application startup
      run: bash ./.github/scripts/verify-linux-appimage.sh target/appimage/config_app.AppImage
    - uses: actions/upload-artifact@v7
      with:
        path: target/appimage/config_app.AppImage
        name: config-app-linux
        if-no-files-found: error

  Windows-App:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        # Stop on every native command failure, even when another command follows.
        shell: >-
          pwsh -NoLogo -NoProfile -NonInteractive -Command
          "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win32
      - name: Install latest stable Rust and Windows x86 target
        run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: "v1-windows-i686-msvc-${{ env.VCToolsVersion }}-sdk-${{ env.UCRTVersion }}"
      - name: Build executable
        run: cargo build --verbose --release --locked --package config_app --bin config_app --target i686-pc-windows-msvc
      - name: View artifacts
        run: Get-Item target/i686-pc-windows-msvc/release/config_app.exe
      - name: Verify Windows executable and application startup
        run: ./.github/scripts/verify-windows-exe.ps1 target/i686-pc-windows-msvc/release/config_app.exe
      - uses: actions/upload-artifact@v7
        with:
          name: config-app-exe
          path: target/i686-pc-windows-msvc/release/config_app.exe
          if-no-files-found: error

  OSX-app:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest # Apple Silicon (ARM64)
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
        with:
          key: "v4-macos-arm64-static-ssl"
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Build Apple Silicon app and DMG
        run: |
          cargo build --release --locked --package config_app
          cargo bundle --release --package config_app --binary-path target/release/config_app --format dmg
          mv target/release/bundle/dmg/Ultimate-NAG52-Config-App.dmg target/release/bundle/dmg/config_app.dmg
        env:
          OPENSSL_STATIC: "1"
      - name: Verify macOS disk image and bundled executable
        run: bash .github/scripts/verify-macos-dmg.sh target/release/bundle/dmg/config_app.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: config-app-osx
          path: target/release/bundle/dmg/config_app.dmg
          if-no-files-found: error

  Create-Upload:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: [Windows-App, Linux-App, OSX-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-exe
    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-linux
    - name: Download OSX artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-osx
    - name: View artifacts
      run: ls -R
    - name: Create release and upload assets
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('{0}-{1}', env.BRANCH_NAME, github.sha) }}
        target_commitish: ${{ github.sha }}
        name: ${{ github.event_name == 'release' && github.event.release.name || format('Release {0}', env.BRANCH_NAME) }}
        draft: false
        prerelease: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name != 'release' && env.BRANCH_NAME != 'main') }}
        files: |
          *.exe
          *.AppImage
          *.dmg
      
          
       
