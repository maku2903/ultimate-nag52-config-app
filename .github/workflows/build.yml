name: Build

on:
  push:
    branches: [ "dev" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

jobs:
  Linux-App:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
      with:
        key: "v1-ubuntu-22.04-x86_64"
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          binutils build-essential curl desktop-file-utils libfontconfig1-dev \
          libfreetype6-dev libudev-dev pkg-config xauth xdotool xvfb
    - name: Build and package Linux AppImage
      run: bash ./.github/scripts/build-linux-appimage.sh
    - name: Verify Linux AppImage and application startup
      run: bash ./.github/scripts/verify-linux-appimage.sh target/appimage/config_app.AppImage
    - uses: actions/upload-artifact@v7
      with:
        path: target/appimage/config_app.AppImage
        name: config-app-linux
        if-no-files-found: error

  Windows-App:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: win32
      - name: Install Rustup using win.rustup.rs
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest https://win.rustup.rs/ -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-host=i686-pc-windows-msvc --default-toolchain=none
          del rustup-init.exe
          rustup target add i686-pc-windows-msvc
        shell: powershell
      - uses: Swatinem/rust-cache@v2
      - name: Build executable
        run: cargo build --verbose --release --target i686-pc-windows-msvc
      - name: View artifacts
        run: ls target -R
      - uses: actions/upload-artifact@v7
        with:
          name: config-app-exe
          path: target/i686-pc-windows-msvc/release/*.exe

  OSX-app:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest # Apple Silicon (ARM64)
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
        with:
          key: "v4-macos-arm64-static-ssl"
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Build Apple Silicon app and DMG
        run: |
          cargo build --release --package config_app
          cargo bundle --release --package config_app --binary-path target/release/config_app --format dmg
          mv target/release/bundle/dmg/Ultimate-NAG52-Config-App.dmg target/release/bundle/dmg/config_app.dmg
        env:
          OPENSSL_STATIC: "1"
      - name: Verify macOS disk image and bundled executable
        run: bash .github/scripts/verify-macos-dmg.sh target/release/bundle/dmg/config_app.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: config-app-osx
          path: target/release/bundle/dmg/config_app.dmg
          if-no-files-found: error

  Create-Upload:
    needs: [Windows-App, Linux-App, OSX-app]
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-exe
    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-linux
    - name: Download OSX artifact
      uses: actions/download-artifact@v8
      with:
        name: config-app-osx
    - name: View artifacts
      run: ls -R
    - name: Create release and upload assets
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('{0}-{1}', env.BRANCH_NAME, github.sha) }}
        target_commitish: ${{ github.sha }}
        name: ${{ github.event_name == 'release' && github.event.release.name || format('Release {0}', env.BRANCH_NAME) }}
        draft: false
        prerelease: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name != 'release' && env.BRANCH_NAME != 'main') }}
        files: |
          *.exe
          *.AppImage
          *.dmg
      
          
       
